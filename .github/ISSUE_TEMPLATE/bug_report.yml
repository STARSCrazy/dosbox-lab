name: Bug report
description: Something in dosbox-lab (MCP server, Python API, CLI, control channel, recordings) does not work
labels: bug

body:
  - type: markdown
    attributes:
      value: |
        Problems with the emulation itself (CPU, DOS, video, sound, a game that does not run) that also occur in plain DOSBox-X belong to the [DOSBox-X issue tracker](https://github.com/joncampbell123/dosbox-x/issues).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - MCP server / MCP tool
        - Python API
        - Command line (dosbox-lab)
        - Recordings (coverage, flow, calls, file log, events)
        - Breakpoints, watchpoints, stepping
        - Save states, function re-run
        - Batch runs (run_batch)
        - Scenarios
        - Build
        - Other
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What happens
      description: Include the tool call, API call or command and the error or wrong result you got.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Ideally with one of the programs in `testprogs/` or a small script. Mention the DOS program if it is publicly available.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: dosbox-lab commit
      placeholder: "git rev-parse --short HEAD"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows version, Python version, Visual Studio toolset, MCP client (if used)
      placeholder: "Windows 11 24H2, Python 3.12, v142, Claude Code"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Logs
      description: Relevant files from the run folder (`.runs/<instance>/`), e.g. the emulator log, or the Python traceback.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Code of conduct
      options:
        - label: I agree to follow the [code of conduct](https://github.com/STARSCrazy/dosbox-lab/blob/main/CODE_OF_CONDUCT.md).
          required: true
