name: Feature request
description: Suggest a new tool, recording or other improvement for dosbox-lab
labels: ["feature request"]

body:
  - type: markdown
    attributes:
      value: |
        Requests for the emulation itself (hardware, DOS, video, sound) belong to [DOSBox-X](https://github.com/joncampbell123/dosbox-x/issues).
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The analysis task, e.g. "find which code writes this memory block while the title screen loads".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: A new MCP tool, API method, recording field, CLI command ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you tried
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Code of conduct
      options:
        - label: I agree to follow the [code of conduct](https://github.com/STARSCrazy/dosbox-lab/blob/main/CODE_OF_CONDUCT.md).
          required: true
