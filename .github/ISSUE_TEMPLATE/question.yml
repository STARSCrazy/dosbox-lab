name: Question
description: Ask how to use dosbox-lab
labels: question

body:
  - type: markdown
    attributes:
      value: |
        The tools are listed in [docs/dosbox-lab/tools.md](https://github.com/STARSCrazy/dosbox-lab/blob/main/docs/dosbox-lab/tools.md), the recording formats in [formats.md](https://github.com/STARSCrazy/dosbox-lab/blob/main/docs/dosbox-lab/formats.md). For general DOSBox-X questions see the [DOSBox-X wiki](https://dosbox-x.com/wiki).
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Code of conduct
      options:
        - label: I agree to follow the [code of conduct](https://github.com/STARSCrazy/dosbox-lab/blob/main/CODE_OF_CONDUCT.md).
          required: true
